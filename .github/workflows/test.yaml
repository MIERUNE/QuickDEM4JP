name: Test plugin

permissions:
  contents: read
  
on:
  pull_request:
    branches:
      - master

env:
  # Docker settings
  DOCKER_IMAGE: qgis/qgis

jobs:
  Test-plugin:
    runs-on: ubuntu-latest

    # QGIS 4 (Qt6) does not make the PR fail until it is known to be stable here
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - docker_tags: "3.44"
          - docker_tags: "4.0-trixie"
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Export requirements.txt
        run: |
          pip3 install uv
          uv export -o requirements.txt --no-dev --no-hashes

      # The images no longer start a test environment (supervisord) and do not
      # all ship qgis_testrunner.sh, so the tests are run directly.
      - name: Docker pull
        run: docker pull "$DOCKER_IMAGE":${{ matrix.docker_tags }}

      - name: Docker run tests
        run: |
          docker run --rm \
            -v "$PWD":/tests_directory/plugin_dir \
            -w /tests_directory/plugin_dir \
            -e QT_QPA_PLATFORM=offscreen \
            -e PYTHONDONTWRITEBYTECODE=1 \
            "$DOCKER_IMAGE":${{ matrix.docker_tags }} \
            sh -c '
              set -e
              # The images are "externally managed" (PEP 668)
              pip3 install --break-system-packages -r requirements.txt
              python3 -m unittest discover -s tests -t . -v
              # Not found by the plugin test discovery: the submodule is not a package
              python3 -m unittest discover -s convert_fgd_dem/tests -t . -v
            '
